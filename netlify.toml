# LINDJA on Netlify: the static site from Vite plus three functions (catalogue, requests, admin) on Netlify Blobs.
# The admin needs two environment variables, made with `npm run admin:password -- "<password>"`:
#   ADMIN_PASSWORD_HASH  scrypt hash of the admin password
#   SESSION_SECRET       32+ random bytes that sign the admin session cookie

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 3820
  port = 3830
  framework = "#custom"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
